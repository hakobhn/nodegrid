# Worker node configuration. Overrides the defaults packaged in nodegrid.jar.
# Values marked (runtime) can also be changed from the Settings page; once changed there,
# the saved value in data/ wins until you press "Reset to defaults".

server:
  port: 8081

nodegrid:
  role: worker
  # Master URL, as shown on the master's Overview page.        (runtime)
  # The worker opens every connection (heartbeat + command long-poll), so only the master
  # has to be reachable from here; nothing needs to connect to this worker.
  master-url: http://localhost:8080
  # node-name: worker-1                 # (runtime) default: <hostname>:<port>
  # heartbeat-interval-seconds: 15      # (runtime)
  # request-timeout-seconds: 5          # (runtime)
