spring:
  application:
    name: nodegrid
  threads:
    virtual:
      enabled: true

server:
  port: 8080

nodegrid:
  # master | worker  (fixed at startup; use the "master" / "worker" profiles or override here)
  role: master
  # Display name; defaults to the host name when empty
  node-name: ""
  # URL of this node shown in the UI (on the master: the URL workers connect to). Empty = http://<lan-ip>:<server.port>
  advertised-url: ""
  # Worker only: where the master lives
  master-url: http://localhost:8080
  # Worker: how often it reports to the master (registration + resources)
  heartbeat-interval-seconds: 15
  # Worker: HTTP read timeout for calls to the master (the command long-poll has its own, longer timeout)
  request-timeout-seconds: 5
  # Master: missed heartbeats before a worker is marked OFFLINE
  offline-after-failures: 3
  # Where runtime-edited settings and the worker list are stored
  data-dir: data

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: logs/nodegrid-${nodegrid.role}-${server.port}.log
